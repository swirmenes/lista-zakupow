name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Budowanie
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Przygotuj plik
        run: cp app/build/outputs/apk/debug/app-debug.apk lista-zakupow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lista-zakupow
          path: lista-zakupow.apk

      - name: Opublikuj wersję do pobrania
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" lista-zakupow.apk \
            --title "Lista zakupów 1.${{ github.run_number }}" \
            --notes "Pobierz plik lista-zakupow.apk na telefonie z Androidem i zainstaluj." \
            --latest
